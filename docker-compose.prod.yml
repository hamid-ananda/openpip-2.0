services:
  db:
    ports: []

  redis:
    ports: []

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-openpip.usask.ca,localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://openpip.usask.ca}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://openpip.usask.ca}
      FRONTEND_URL: ${FRONTEND_URL:-https://openpip.usask.ca/v2}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@openpip.usask.ca}
    volumes: []
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_initial_data &&
             exec gunicorn openpip.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
    volumes: []
