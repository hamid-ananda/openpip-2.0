services:
  db:
    ports: []

  redis:
    ports: []

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-openpip.usask.ca,localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://openpip.usask.ca}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://openpip.usask.ca}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_BASE_URL: ${ORCID_BASE_URL:-https://orcid.org}
    volumes: []
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_initial_data &&
             exec gunicorn openpip.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
    volumes: []
