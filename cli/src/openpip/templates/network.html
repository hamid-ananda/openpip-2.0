<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0}#cy{width:{{WIDTH}}px;height:{{HEIGHT}}px;background:#1a1a2e}</style>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.29.0/dist/cytoscape.min.js"></script>
</head>
<body>
<div id="cy"></div>
<script>
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: {{ELEMENTS}},
  style: [
    {selector:'node', style:{'background-color':'#4cc9f0','label':'data(label)','color':'#fff','font-size':14,'text-valign':'center','width':40,'height':40}},
    {selector:'edge', style:{'width':2,'line-color':'#555','target-arrow-color':'#555','curve-style':'bezier','opacity':0.7}}
  ],
  layout: {name:'cose', animate:false},
});
window.onCytoscapeReady = function() {
  return cy.png({full:true, scale:2, bg:'#1a1a2e'});
};
cy.ready(function() { document.title = 'READY'; });
</script>
</body>
</html>
