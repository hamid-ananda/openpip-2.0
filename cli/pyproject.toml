[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpip"
version = "2.0.0"
description = "openPIP CLI and Python SDK — protein interaction database"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "textual>=0.80",
    "rich-pixels>=3.0",
    "Pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "playwright>=1.44",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
    "pandas>=2.2",
]

[project.scripts]
openpip = "openpip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openpip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
