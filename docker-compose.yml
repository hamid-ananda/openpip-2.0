version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openpip
      POSTGRES_USER: openpip
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openpip_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.dev
      DATABASE_URL: postgres://openpip:${DB_PASSWORD:-openpip_dev}@db:5432/openpip
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-me}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_initial_data &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    profiles: [prod]
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
