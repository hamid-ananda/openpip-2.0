<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>openPIP — modernized</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-more.jsx"></script>

<script type="text/babel" data-presets="react">
const { useEffect: useE2 } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "#2563eb",
  "density": "comfortable",
  "nodeStyle": "filled",
  "layout": "panel-left"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  // Apply theme globally
  useE2(() => {
    document.documentElement.setAttribute('data-theme', tw.theme);
  }, [tw.theme]);

  // Apply accent globally via CSS var
  useE2(() => {
    document.documentElement.style.setProperty('--primary', tw.accent);
    const map = {
      '#2563eb': { soft: '#dbeafe', deep: '#1e40af' },
      '#0891b2': { soft: '#cffafe', deep: '#155e75' },
      '#7c3aed': { soft: '#ede9fe', deep: '#5b21b6' },
      '#059669': { soft: '#d1fae5', deep: '#065f46' },
    }[tw.accent] || { soft: '#dbeafe', deep: '#1e40af' };
    document.documentElement.style.setProperty('--primary-soft', map.soft);
    document.documentElement.style.setProperty('--primary-deep', map.deep);
  }, [tw.accent]);

  return (
    <>
      <window.DesignCanvas title="openPIP — modernization" subtitle={`Dashboard reframe · ${tw.theme === 'dark' ? 'dark' : 'light'} mode · 8 screens`}>
        <window.DCSection id="home" title="Home / landing">
          <window.DCArtboard id="home-a" label="Hero + quick actions" width={1440} height={1280}>
            <window.HomeScreen density={tw.density}/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="main" title="Search & network (Option A)">
          <window.DCArtboard id="search-a" label="Modern dashboard — primary tool" width={1440} height={980}>
            <window.SearchScreen density={tw.density} nodeStyle={tw.nodeStyle} layout={tw.layout}/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="detail" title="Protein detail">
          <window.DCArtboard id="protein-a" label="Single protein drill-down" width={1440} height={1320}>
            <window.ProteinDetailScreen density={tw.density}/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="downloads" title="Downloads">
          <window.DCArtboard id="dl-a" label="Dataset table with format chips" width={1440} height={900}>
            <window.DownloadsScreen density={tw.density}/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="docs" title="Docs / API">
          <window.DCArtboard id="docs-a" label="API reference — search endpoint" width={1440} height={1100}>
            <window.DocsScreen density={tw.density}/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="about" title="About / FAQ / Contact">
          <window.DCArtboard id="about-a" label="Single page with side nav" width={1440} height={900}>
            <window.AboutScreen density={tw.density}/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="auth" title="Sign in / Register">
          <window.DCArtboard id="login-a" label="Sign in — split layout" width={1440} height={900}>
            <window.LoginScreen density={tw.density}/>
          </window.DCArtboard>
          <window.DCArtboard id="register-a" label="Create account" width={1440} height={900}>
            <window.RegisterScreen density={tw.density}/>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="Theme">
            <window.TweakRadio
              label="Mode"
              value={tw.theme}
              options={[{value:'light', label:'Light'},{value:'dark', label:'Dark'}]}
              onChange={v => setTweak('theme', v)}
            />
          </window.TweakSection>
          <window.TweakSection title="Brand">
            <window.TweakColor
              label="Accent"
              value={tw.accent}
              options={['#2563eb','#0891b2','#7c3aed','#059669']}
              onChange={v => setTweak('accent', v)}
            />
          </window.TweakSection>
          <window.TweakSection title="Density">
            <window.TweakRadio
              label="Spacing"
              value={tw.density}
              options={[{value:'compact', label:'Compact'},{value:'comfortable', label:'Comfortable'}]}
              onChange={v => setTweak('density', v)}
            />
          </window.TweakSection>
          <window.TweakSection title="Network">
            <window.TweakRadio
              label="Node style"
              value={tw.nodeStyle}
              options={[{value:'filled', label:'Filled'},{value:'outlined', label:'Outlined'},{value:'minimal', label:'Minimal'}]}
              onChange={v => setTweak('nodeStyle', v)}
            />
            <window.TweakRadio
              label="Panel layout"
              value={tw.layout}
              options={[{value:'panel-left', label:'Left'},{value:'panel-right', label:'Right'}]}
              onChange={v => setTweak('layout', v)}
            />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
