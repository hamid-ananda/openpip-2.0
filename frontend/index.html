<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      What the browser shows before React starts. Every value here is replaced
      at runtime from the admin settings — the uploaded logo, the site title,
      and a manifest naming both — by src/lib/branding.ts.

      %BASE_URL% rather than a relative path: a deep link like /search/TP53
      would otherwise ask the server for /search/favicon.svg.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>openPIP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
